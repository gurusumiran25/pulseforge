[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseforge"
version = "0.1.0"
description = "Synthetic product intelligence and data reliability platform"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["apps*", "services*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
