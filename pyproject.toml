[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseforge"
version = "1.0.0"
description = "Synthetic product intelligence and data reliability platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "confluent-kafka>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]
dashboard = ["streamlit>=1.40,<2", "streamlit-autorefresh>=1.0,<2"]
warehouse = ["dbt-duckdb>=1.8,<2", "duckdb>=1.1,<2"]
portfolio = ["streamlit>=1.40,<2", "streamlit-autorefresh>=1.0,<2", "dbt-duckdb>=1.8,<2", "duckdb>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["apps*", "services*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
