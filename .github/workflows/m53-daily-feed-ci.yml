name: M53 daily public feed integration

on:
  pull_request:
    paths:
      - 'services/analytics/daily_public_feed.py'
      - 'apps/dashboard/**'
      - 'tests/integration/test_m53_daily_public_feed.py'
      - 'tests/dashboard/test_m53_public_feed.py'
      - '.github/workflows/m53-daily-feed-ci.yml'
      - '.github/workflows/daily-public-feed.yml'
  push:
    branches: [main]
    paths:
      - 'services/analytics/daily_public_feed.py'
      - 'apps/dashboard/**'
      - 'tests/integration/test_m53_daily_public_feed.py'
      - 'tests/dashboard/test_m53_public_feed.py'
      - '.github/workflows/m53-daily-feed-ci.yml'
      - '.github/workflows/daily-public-feed.yml'

permissions:
  contents: read

jobs:
  daily-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,portfolio]'
      - name: Real daily generation, dbt quality and integrity tests
        env:
          PULSEFORGE_RUN_M53_DAILY: '1'
          PULSEFORGE_PUBLIC_FEED: '0'
        run: python -m pytest -q tests/integration/test_m53_daily_public_feed.py tests/dashboard/test_m53_public_feed.py
      - name: Lint new modules
        run: python -m ruff check services/analytics/daily_public_feed.py apps/dashboard/public_feed.py tests/integration/test_m53_daily_public_feed.py tests/dashboard/test_m53_public_feed.py
