name: M89 Power BI report contract
on:
  pull_request:
    paths:
      - 'powerbi/**'
      - 'docs/M88_POWERBI_DAX.md'
      - 'services/analytics/bi_report.py'
      - 'tests/analytics/test_m89_bi_report.py'
      - '.github/workflows/m89-powerbi-report.yml'
  push:
    branches: [main, feature/powerbi-v1.1.0]
    paths:
      - 'powerbi/**'
      - 'docs/M88_POWERBI_DAX.md'
      - 'services/analytics/bi_report.py'
      - 'tests/analytics/test_m89_bi_report.py'
      - '.github/workflows/m89-powerbi-report.yml'
permissions:
  contents: read
jobs:
  report-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/analytics/test_m89_bi_report.py
