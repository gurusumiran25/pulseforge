name: M83 tracked content secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tracked filenames and file contents
        run: |
          python scripts/check_release_hygiene.py
          python scripts/check_tracked_secrets.py
      - name: Run secret-scan regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/release/test_m83_secret_content.py
