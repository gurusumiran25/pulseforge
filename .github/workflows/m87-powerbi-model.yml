name: M87 Power BI semantic model
on:
  pull_request:
    paths:
      - 'powerbi/model/**'
      - 'services/analytics/bi_*.py'
      - 'services/analytics/daily_public_feed.py'
      - 'tests/analytics/test_m87_bi_model.py'
      - 'tests/integration/test_m53_daily_public_feed.py'
      - '.github/workflows/m87-powerbi-model.yml'
  push:
    branches: [main, feature/powerbi-v1.1.0]
    paths:
      - 'powerbi/model/**'
      - 'services/analytics/bi_*.py'
      - 'services/analytics/daily_public_feed.py'
      - 'tests/analytics/test_m87_bi_model.py'
      - 'tests/integration/test_m53_daily_public_feed.py'
      - '.github/workflows/m87-powerbi-model.yml'
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,portfolio]'
      - name: Model grain and relationship regression
        run: python -m pytest -q tests/analytics/test_m87_bi_model.py
      - name: Real warehouse export integration
        env:
          PULSEFORGE_RUN_M53_DAILY: '1'
          PULSEFORGE_PUBLIC_FEED: '0'
        run: python -m pytest -q tests/integration/test_m53_daily_public_feed.py
