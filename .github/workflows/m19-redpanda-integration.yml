name: M19 Redpanda integration

on:
  push:
    branches:
      - feature/m19-streaming-reliability
    paths:
      - ".github/workflows/m19-redpanda-integration.yml"
      - "docker-compose.m19-test.yml"
      - "tests/integration/**"
      - "services/streaming/**"
      - "services/storage/**"
      - "contracts/**"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/m19-redpanda-integration.yml"
      - "docker-compose.m19-test.yml"
      - "tests/integration/**"
      - "services/streaming/**"
      - "services/storage/**"
      - "contracts/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-redpanda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PULSEFORGE_RUN_BROKER_TESTS: "1"
      PULSEFORGE_TEST_BOOTSTRAP: "127.0.0.1:19093"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Start disposable M19 Redpanda
        run: docker compose -p pulseforge-m19-test -f docker-compose.m19-test.yml up -d

      - name: Wait for broker metadata readiness
        shell: bash
        run: |
          python - <<'PY'
          import time
          from confluent_kafka.admin import AdminClient

          broker = AdminClient({"bootstrap.servers": "127.0.0.1:19093"})
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  metadata = broker.list_topics(timeout=3)
                  if metadata.brokers:
                      print("Dedicated M19 Redpanda broker is ready")
                      break
              except Exception as exc:
                  print(f"Waiting for M19 broker: {exc}")
              time.sleep(2)
          else:
              raise SystemExit("Dedicated M19 broker did not become ready within 90 seconds")
          PY

      - name: Run live M19 integration tests
        run: python -m pytest -v -s -p no:cacheprovider tests/integration/test_m19_broker_roundtrip.py

      - name: Inspect dedicated broker on failure
        if: failure()
        run: docker compose -p pulseforge-m19-test -f docker-compose.m19-test.yml logs --tail=100

      - name: Remove disposable M19 environment
        if: always()
        run: docker compose -p pulseforge-m19-test -f docker-compose.m19-test.yml down
