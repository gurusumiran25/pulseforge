name: M24 generator warehouse integration
on:
  push:
    paths:
      - 'services/generator/**'
      - 'services/storage/**'
      - 'contracts/**'
      - 'warehouse/sql/**'
      - 'tests/integration/test_m24_generator_warehouse_e2e.py'
      - '.github/workflows/m24-e2e.yml'
  pull_request:
    paths:
      - 'services/generator/**'
      - 'services/storage/**'
      - 'contracts/**'
      - 'warehouse/sql/**'
      - 'tests/integration/test_m24_generator_warehouse_e2e.py'
      - '.github/workflows/m24-e2e.yml'
jobs:
  generator-to-warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -v tests/integration/test_m24_generator_warehouse_e2e.py
