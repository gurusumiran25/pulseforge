name: M21 dashboard
on:
  push:
    paths:
      - 'apps/dashboard/**'
      - 'tests/dashboard/**'
      - '.github/workflows/m21-dashboard.yml'
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'tests/dashboard/**'
      - '.github/workflows/m21-dashboard.yml'
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard and test dependencies
        run: python -m pip install -e '.[dev]' 'streamlit>=1.39,<2'
      - name: Validate Streamlit module syntax
        run: python -m compileall -q apps/dashboard
      - name: Verify dashboard metrics
        run: python -m pytest -v tests/dashboard
      - name: Streamlit headless startup smoke test
        run: |
          streamlit run apps/dashboard/streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
