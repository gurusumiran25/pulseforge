name: M92 Power BI end-to-end acceptance
on:
  push:
    branches: [main, feature/powerbi-v1.1.0]
    paths: ['services/analytics/**', 'powerbi/**', 'tests/integration/test_m53_daily_public_feed.py', '.github/workflows/m92-powerbi-acceptance.yml']
  pull_request:
    paths: ['services/analytics/**', 'powerbi/**', 'tests/integration/test_m53_daily_public_feed.py', '.github/workflows/m92-powerbi-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PULSEFORGE_RUN_M53_DAILY: '1'
      PULSEFORGE_PUBLIC_FEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,portfolio]'
      - run: python -m pytest -q tests/integration/test_m53_daily_public_feed.py tests/analytics/test_m87_bi_model.py tests/analytics/test_m88_bi_kpis.py tests/analytics/test_m89_bi_report.py tests/analytics/test_m90_bi_navigation.py tests/analytics/test_m91_bi_refresh.py
      - run: python -m ruff check tests/integration/test_m53_daily_public_feed.py
