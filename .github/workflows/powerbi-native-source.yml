name: Power BI native source checks
on:
  push:
    branches: [main, feature/powerbi-v1.1.0]
    paths: ['powerbi/**', 'docs/M88_POWERBI_DAX.md', 'services/analytics/bi_tmdl.py', 'tests/analytics/test_bi_tmdl.py', '.github/workflows/powerbi-native-source.yml']
  pull_request:
    paths: ['powerbi/**', 'docs/M88_POWERBI_DAX.md', 'services/analytics/bi_tmdl.py', 'tests/analytics/test_bi_tmdl.py', '.github/workflows/powerbi-native-source.yml']
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/analytics/test_bi_tmdl.py
