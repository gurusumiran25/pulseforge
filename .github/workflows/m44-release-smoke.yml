name: M44 portfolio release smoke

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'services/analytics/**'
      - 'apps/dashboard/**'
      - 'warehouse/dbt/**'
      - 'tests/dashboard/**'
      - 'tests/integration/test_m43_real_dbt_batch.py'
      - '.github/workflows/m44-release-smoke.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'services/analytics/**'
      - 'apps/dashboard/**'
      - 'warehouse/dbt/**'
      - 'tests/dashboard/**'
      - 'tests/integration/test_m43_real_dbt_batch.py'
      - '.github/workflows/m44-release-smoke.yml'

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared extras from clean environment
        run: python -m pip install -e '.[dev,portfolio]'
      - name: Check dependency resolution
        run: python -m pip check
      - name: Run dashboard AppTest
        run: python -m pytest -q tests/dashboard/test_m31_streamlit_render.py
      - name: Run real SQLite to DuckDB quality-gated warehouse batch
        env:
          PULSEFORGE_RUN_M43_DBT: '1'
        run: python -m pytest -q tests/integration/test_m43_real_dbt_batch.py
