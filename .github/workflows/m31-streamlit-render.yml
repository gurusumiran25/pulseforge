name: M31 Streamlit rendered widgets
on:
  push:
    paths:
      - 'apps/dashboard/**'
      - 'tests/dashboard/test_m31_streamlit_render.py'
      - '.github/workflows/m31-streamlit-render.yml'
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'tests/dashboard/test_m31_streamlit_render.py'
      - '.github/workflows/m31-streamlit-render.yml'
jobs:
  streamlit-app-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard test dependencies
        run: python -m pip install -e '.[dev]' 'streamlit>=1.39,<2'
      - name: Execute dashboard with Streamlit AppTest
        run: python -m pytest -v tests/dashboard/test_m31_streamlit_render.py
