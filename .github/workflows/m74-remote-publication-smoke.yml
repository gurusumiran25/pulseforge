name: M74 remote dashboard feed smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
  workflow_run:
    workflows: ['Daily synthetic dashboard refresh']
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/m74-remote-publication-smoke.yml'
      - 'scripts/verify_remote_publication.py'
      - 'tests/release/test_m74_remote_publication.py'

permissions:
  contents: read

jobs:
  remote-smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'gurusumiran25/pulseforge')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard and testing dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate public CDN Bronze and payment feed with bounded retries
        run: python scripts/verify_remote_publication.py --max-age-hours 36 --attempts 4 --retry-seconds 20
      - name: Run remote smoke regressions
        run: python -m pytest -q tests/release/test_m74_remote_publication.py
