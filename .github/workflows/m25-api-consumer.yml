name: M25 API consumer integration
on:
  push:
    paths:
      - 'services/ingestion/**'
      - 'services/streaming/**'
      - 'services/storage/**'
      - 'services/generator/**'
      - 'contracts/**'
      - 'warehouse/sql/**'
      - 'tests/integration/test_m25_api_consumer_sqlite.py'
      - '.github/workflows/m25-api-consumer.yml'
  pull_request:
    paths:
      - 'services/ingestion/**'
      - 'services/streaming/**'
      - 'services/storage/**'
      - 'services/generator/**'
      - 'contracts/**'
      - 'warehouse/sql/**'
      - 'tests/integration/test_m25_api_consumer_sqlite.py'
      - '.github/workflows/m25-api-consumer.yml'
jobs:
  api-to-warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -v tests/integration/test_m25_api_consumer_sqlite.py
