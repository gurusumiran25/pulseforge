name: M43 real warehouse quality gate

on:
  push:
    paths:
      - 'services/analytics/**'
      - 'warehouse/dbt/**'
      - 'tests/integration/test_m43_real_dbt_batch.py'
      - '.github/workflows/m43-real-warehouse-quality.yml'
  pull_request:
    paths:
      - 'services/analytics/**'
      - 'warehouse/dbt/**'
      - 'tests/integration/test_m43_real_dbt_batch.py'
      - '.github/workflows/m43-real-warehouse-quality.yml'

jobs:
  real-dbt-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install project and dbt DuckDB
        run: python -m pip install -e '.[dev]' 'dbt-duckdb>=1.8,<2'
      - name: Execute real warehouse batch with quality gate
        env:
          PULSEFORGE_RUN_M43_DBT: '1'
        run: python -m pytest -q tests/integration/test_m43_real_dbt_batch.py
