name: M45 one-command portfolio demo

on:
  push:
    paths:
      - 'services/analytics/**'
      - 'services/generator/**'
      - 'services/storage/**'
      - 'apps/dashboard/metrics.py'
      - 'warehouse/dbt/**'
      - 'tests/integration/test_m45_portfolio_demo.py'
      - '.github/workflows/m45-portfolio-demo.yml'
  pull_request:
    paths:
      - 'services/analytics/**'
      - 'services/generator/**'
      - 'services/storage/**'
      - 'apps/dashboard/metrics.py'
      - 'warehouse/dbt/**'
      - 'tests/integration/test_m45_portfolio_demo.py'
      - '.github/workflows/m45-portfolio-demo.yml'

jobs:
  end-to-end-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -e '.[dev,portfolio]'
      - name: Execute real synthetic demo
        env:
          PULSEFORGE_RUN_M45_DEMO: '1'
        run: python -m pytest -q tests/integration/test_m45_portfolio_demo.py
