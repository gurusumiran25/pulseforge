name: Daily synthetic dashboard refresh

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-public-feed.yml'
      - 'services/analytics/daily_public_feed.py'
      - 'services/analytics/payment_sidecar.py'
      - 'services/analytics/public_feed_health.py'

permissions:
  contents: write

concurrency:
  group: pulseforge-public-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gurusumiran25/pulseforge'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and validate dependencies
        run: |
          python -m pip install -e '.[dev,portfolio]'
          python -m pip check
      - name: Build rolling 14-day synthetic data and validate warehouse
        run: python -m services.analytics.daily_public_feed --output-dir data/public --bi-output-dir data/bi --days 14 --sessions-per-day 40
      - name: Require verified Bronze and payment sidecar before publishing
        run: python -m services.analytics.public_feed_health --directory data/public --max-age-hours 2 --require-payment-sidecar
      - name: Verify BI snapshot before git publication
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("data/bi")
          pointer = json.loads((root / "current.json").read_text())
          snapshot = root / pointer["snapshot"]
          raw = (snapshot / "manifest.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == pointer["snapshot"]
          files = json.loads(raw)["files"]
          assert set(files) == {"FactEvent.csv", "FactSession.csv", "FactPayment.csv", "FactDailyUser.csv", "DimDate.csv", "DimCustomer.csv", "DimCurrency.csv", "FactProductView.csv", "DimProduct.csv"}
          for name, meta in files.items():
              data = (snapshot / name).read_bytes()
              assert len(data) == meta["bytes"]
              assert hashlib.sha256(data).hexdigest() == meta["sha256"]
          PY
      - name: Publish validated CSV, manifest, and status together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/latest_bronze.csv data/public/latest_bronze.manifest.json data/public/latest_payments.csv data/public/status.json
          git add data/bi/current.json data/bi/$(python -c 'import json; print(json.load(open("data/bi/current.json"))["snapshot"])')
          if git diff --cached --quiet; then
            echo "No data changes to publish"
          else
            git commit -m "data: refresh synthetic dashboard feed"
            git push origin HEAD:main
          fi
