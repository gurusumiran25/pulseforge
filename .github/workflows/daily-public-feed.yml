name: Daily synthetic dashboard refresh

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulseforge-public-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gurusumiran25/pulseforge'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and validate dependencies
        run: |
          python -m pip install -e '.[dev,portfolio]'
          python -m pip check
      - name: Build rolling 14-day synthetic data and validate warehouse
        run: python -m services.analytics.daily_public_feed --output-dir data/public --days 14 --sessions-per-day 40
      - name: Publish validated CSV, manifest, and status together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/latest_bronze.csv data/public/latest_bronze.manifest.json data/public/latest_payments.csv data/public/status.json
          if git diff --cached --quiet; then
            echo "No data changes to publish"
          else
            git commit -m "data: refresh synthetic dashboard feed"
            git push origin HEAD:main
          fi
