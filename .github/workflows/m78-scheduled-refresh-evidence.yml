name: M78 consecutive scheduled refresh evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m78-scheduled-refresh-evidence.yml'
      - 'scripts/audit_scheduled_refresh.py'
      - 'tests/release/test_m78_scheduled_refresh.py'

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scheduled-run evidence logic
        run: python -m pip install pytest && python -m pytest -q tests/release/test_m78_scheduled_refresh.py
      - name: Audit real scheduled publisher executions
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_scheduled_refresh.py --required 2
