name: M33 real broker to dbt warehouse
on:
  push:
    paths:
      - 'tests/integration/test_m33_real_broker_to_dbt.py'
      - '.github/workflows/m33-broker-to-dbt.yml'
      - 'services/analytics/bronze_export.py'
      - 'services/ingestion/**'
      - 'services/streaming/**'
      - 'services/storage/**'
      - 'warehouse/dbt/**'
      - 'warehouse/sql/**'
  pull_request:
    paths:
      - 'tests/integration/test_m33_real_broker_to_dbt.py'
      - '.github/workflows/m33-broker-to-dbt.yml'
      - 'services/analytics/bronze_export.py'
      - 'services/ingestion/**'
      - 'services/streaming/**'
      - 'services/storage/**'
      - 'warehouse/dbt/**'
      - 'warehouse/sql/**'
jobs:
  broker-warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' 'dbt-duckdb>=1.8,<2'
      - name: Start disposable Redpanda
        run: |
          docker run -d --name m33-redpanda -p 19092:9092 redpandadata/redpanda:v24.3.9 \
            redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M \
            --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 \
            --advertise-kafka-addr 127.0.0.1:19092
          for i in $(seq 1 40); do
            if docker exec m33-redpanda rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs m33-redpanda
          exit 1
      - name: Test real Kafka through dbt warehouse parity
        env:
          M33_KAFKA_BOOTSTRAP: 127.0.0.1:19092
        run: python -m pytest -v tests/integration/test_m33_real_broker_to_dbt.py
