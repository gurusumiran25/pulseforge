version: 2
models:
  - name: stg_events
    description: "Normalized synthetic Bronze events."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_name
        data_tests:
          - not_null
          - accepted_values:
              values: ['page_view', 'product_viewed', 'add_to_cart', 'checkout_started', 'payment_succeeded']
  - name: fct_session_funnel
    description: "One row per session; stage flags do not enforce event ordering."
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: event_count
        data_tests: [not_null]
  - name: agg_daily_funnel
    description: "Daily cohorts based on session first event UTC date."
    columns:
      - name: cohort_date_utc
        data_tests: [unique, not_null]
